<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5a0"/>
      <stop offset="100%" stop-color="#3d9eff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="#080b10"/>
  <rect x="10" y="10" width="492" height="492" rx="92" fill="url(#bg)" opacity="0.15"/>
  <!-- Circular arrows icon -->
  <g transform="translate(256,256)" fill="none" stroke="url(#bg)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top arc (clockwise) -->
    <path d="M 0,-140 A 140,140 0 0,1 121,70" />
    <polygon points="121,70 155,30 85,20" fill="url(#bg)" stroke="none"/>
    <!-- Bottom arc (clockwise) -->
    <path d="M 0,140 A 140,140 0 0,1 -121,-70" />
    <polygon points="-121,-70 -155,-30 -85,-20" fill="url(#bg)" stroke="none"/>
  </g>
  <!-- Dollar / $ symbol in centre -->
  <text x="256" y="292" font-size="120" font-weight="700" text-anchor="middle"
        fill="url(#bg)" font-family="system-ui, -apple-system, sans-serif">$</text>
</svg>
